[project]
name = "simplenote-migrate"
version = "0.1.0"
description = "Migrate SimpleNote notes to markdown and/or Bitwarden using an LLM classifier"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "piotrs", email = "stepinski@gmail.com" }]
dependencies = ["simplenote", "openai", "tqdm"]

[project.urls]
Homepage = "https://github.com/<you>/simplenote-migrate"
Issues = "https://github.com/<you>/simplenote-migrate/issues"

[tool.uv]
package = false
